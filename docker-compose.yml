# Docker Compose for ai-career-copilot-rs
#
# Quick start:
#   1. cp .env.example .env
#   2. edit .env, set SESSION_SECRET (LLM_API_KEY is optional — you can
#      configure the LLM from the in-app Settings page after first login)
#   3. docker compose up -d --build
#
# The service builds the Rust backend + Vue frontend into a single image
# (multi-stage build, see Dockerfile) and persists SQLite to a named volume.
# LLM credentials live in /data/app.db (the `app_settings` table), so they
# survive `docker compose down/up` and don't need to be in .env at all.

name: ai-career-copilot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-career-copilot:latest
    container_name: ai-career-copilot
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # --- Server
      BIND_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      TZ: ${TZ:-Asia/Shanghai}
      RUST_LOG: ${RUST_LOG:-info}

      # --- Session signing (required; generate with `openssl rand -hex 32`)
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env (use openssl rand -hex 32)}"

      # --- LLM (OpenAI-compatible; default DeepSeek)
      # OPTIONAL. These act as a one-time seed for the app_settings table
      # on first boot only. After you configure the LLM from the in-app
      # Settings page, the database value wins and these are ignored.
      # Leave empty if you'd rather configure everything from the UI.
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}

      # --- Public domain used to build OIDC redirect URLs (host[:port])
      APP_DOMAIN: ${APP_DOMAIN:-localhost:8080}

      # --- Optional Lazycat / generic OIDC (leave empty for the
      # password-less email login fallback; see README#登录方式).
      LAZYCAT_AUTH_OIDC_CLIENT_ID: ${LAZYCAT_AUTH_OIDC_CLIENT_ID:-}
      LAZYCAT_AUTH_OIDC_CLIENT_SECRET: ${LAZYCAT_AUTH_OIDC_CLIENT_SECRET:-}
      LAZYCAT_AUTH_OIDC_AUTH_URI: ${LAZYCAT_AUTH_OIDC_AUTH_URI:-}
      LAZYCAT_AUTH_OIDC_TOKEN_URI: ${LAZYCAT_AUTH_OIDC_TOKEN_URI:-}
      LAZYCAT_AUTH_OIDC_USERINFO_URI: ${LAZYCAT_AUTH_OIDC_USERINFO_URI:-}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  app-data:
    driver: local
